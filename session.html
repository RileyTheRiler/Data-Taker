<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Data Taker">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<title>Data Taker — Session</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app">
<div id="session">

  <!-- Context header -->
  <header class="context-header">
    <a class="exit" href="/" title="Back to setup">&#8592;</a>
    <div class="context-meta">
      <span id="client-label" class="client-label">&hellip;</span>
      <span id="timer" class="timer">00:00:00</span>
    </div>
    <button id="end-session" class="btn-end" type="button">End</button>
  </header>

  <!-- Target carousel -->
  <div class="carousel">
    <button id="prev-target" class="carousel-arrow" type="button" aria-label="Previous target">&#8249;</button>
    <div class="carousel-track" id="carousel-track"></div>
    <button id="next-target" class="carousel-arrow" type="button" aria-label="Next target">&#8250;</button>
  </div>
  <div id="carousel-dots" class="carousel-dots"></div>

  <!-- Real-time dashboard -->
  <section class="dashboard">
    <div class="accuracy-big">
      <span id="target-accuracy" class="accuracy-num">0%</span>
      <span class="accuracy-caption">this target &middot; <span id="target-count">0 trials</span></span>
    </div>
    <div class="accuracy-small">
      <span id="overall-accuracy" class="accuracy-num-sm">0%</span>
      <span class="accuracy-caption">overall &middot; <span id="overall-count">0 trials</span></span>
    </div>
  </section>

  <!-- Cueing toggles -->
  <section class="cues">
    <p class="cues-label">Cueing level (arm before tapping)</p>
    <div id="cue-toggles" class="cue-toggles"></div>
  </section>

  <!-- Action zone -->
  <section class="action-zone">
    <button id="tap-correct" class="tap tap-correct" type="button">
      <span class="tap-symbol">+</span>
      <span class="tap-label">Correct</span>
    </button>
    <button id="tap-incorrect" class="tap tap-incorrect" type="button">
      <span class="tap-symbol">&minus;</span>
      <span class="tap-label">Incorrect</span>
    </button>
  </section>

  <!-- Last 5 log -->
  <section class="recent">
    <p class="recent-label">Recent trials (tap &times; to undo)</p>
    <ul id="recent-log" class="recent-log"></ul>
  </section>

  <!-- End-of-session summary -->
  <div id="ended-banner" class="ended-banner hidden">
    <p>Session ended.</p>
    <p>Total duration: <strong id="final-duration">—</strong></p>
    <a class="btn-primary" href="/">New Session</a>
  </div>
</div>
</div>
<script src="/static/js/storage.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
