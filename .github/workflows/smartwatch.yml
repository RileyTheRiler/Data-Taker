name: Smartwatch

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/smartwatch-support]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle --project-dir android :phone:testDebugUnitTest :phone:assembleDebug :wear:assembleDebug

  wear-emulator-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [wearos_small_round, wearos_square]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture official Wear OS emulator screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --project-dir android :wear:assembleDebug
            adb install -r android/wear/build/outputs/apk/debug/wear-debug.apk
            adb shell am start -n com.rileytheriler.datataker/.MainActivity --ez screenshot_demo true
            sleep 3
            mkdir -p watch-screenshots
            adb exec-out screencap -p > watch-screenshots/${{ matrix.profile }}.png
      - uses: actions/upload-artifact@v4
        with:
          name: watch-${{ matrix.profile }}-screenshot
          path: watch-screenshots/${{ matrix.profile }}.png
